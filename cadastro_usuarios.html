<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app http://127.0.0.1:9000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000; frame-src https://*.firebaseapp.com https://*.firebaseio.com http://127.0.0.1:9000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Fonte Negra">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários | Fonte Negra</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" integrity="sha384-4gq9w/AGf72FXdNQ3Kn3EqWP7633NbCMjpYHt8YCZyXf23o2opcuAr4cif41tLrC" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" integrity="sha384-5PDE6CZvnNIJI5xu68GIFoOO3U73lAnRLBwPBmmKjWnYnYwKEHWr/ghtGooEOXGb" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" integrity="sha384-xtdq4MQqPj1dB5DQsuw9O7dh4kHhMP/Wp5u8O1jiaWiou13ZfJIgiccjtVK2pBhL" crossorigin="anonymous"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sessao.js" data-exigir-login></script>
    <script src="js/topo.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/layout.css">
    <style>
        /* Layout, topo, controles e blocos vêm de assets/css/layout.css */
        .hidden { display: none !important; }
        .painel-form { max-width: 480px; margin: 0 auto; box-shadow: 8px 8px 0 var(--azul-escuro); }
        .painel-form .campo input { width: 100%; }
        .painel-form .btn { width: 100%; margin-top: 4px; }
        .painel-form .btn:disabled { cursor: wait; }
        .campo .invalido { border-color: var(--perigo); }
        .erro-campo { margin: 4px 0 0; color: var(--perigo); font-family: Arial, Helvetica, sans-serif; font-size: .85rem; }
        .resultado { margin: 4px 0 12px; text-align: center; font-family: Arial, Helvetica, sans-serif; }
        .resultado.ok { color: var(--ok); }
        .resultado.erro { color: var(--perigo); }
        .painel-form .nota { text-align: center; }
        .aviso-painel { max-width: 480px; margin: 0 auto; text-align: center; }
        .aviso-painel.restrito { border-color: var(--perigo); }
        .aviso-painel.restrito h2 { color: var(--perigo); }
        fieldset { border: 0; padding: 0; margin: 0 0 12px; }
        legend { padding: 0; font-size: .85rem; color: var(--suave); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .papeis { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 4px; }
        /* Seletor de permissão: rádios escondidos, rótulos inclinados */
        .opcao-papel { position: relative; cursor: pointer; margin: 0; }
        .opcao-papel input { position: absolute; opacity: 0; pointer-events: none; }
        .opcao-papel span {
            display: block; text-align: center; padding: 8px; transform: skewX(-12deg);
            background: var(--bg); color: var(--suave); border: 2px solid var(--azul-escuro);
            font-size: 1rem; color: var(--suave); transition: background .12s, border-color .12s;
        }
        .opcao-papel span span { display: inline-block; padding: 0; border: 0; background: none; transform: skewX(12deg); color: inherit; }
        .opcao-papel:hover > span { border-color: var(--azul-claro); }
        .opcao-papel input:focus-visible + span { outline: 2px solid var(--azul-claro); outline-offset: 2px; }
        .opcao-papel input:checked + span.papel-jogador { background: var(--azul); color: #fff; border-color: var(--azul-claro); }
        .opcao-papel input:checked + span.papel-mestre { background: #7f1d1d; color: #fff; border-color: var(--perigo); }
    </style>
</head>
<body>

    <header class="topo">
        <a class="voltar" href="index.html">‹ Hub</a>
        <div class="titulo">
            <h1>Cadastro de Usuários</h1>
            <p class="tagline">Novos membros da mesa</p>
        </div>
        <div class="espaco"></div>
        <div class="usuario" data-usuario hidden></div>
    </header>

    <main class="conteudo">
        <!-- Aviso para quem não é Mestre (restrição visual; quem bloqueia de fato são as Regras do Firebase) -->
        <section id="aviso-restrito" class="bloco aviso-painel restrito hidden">
            <h2>Acesso restrito</h2>
            <p class="txt">Só o Mestre pode cadastrar usuários.</p>
        </section>

        <section id="painel-cadastro" class="bloco painel-form hidden">
            <h2>Novo usuário</h2>
            <form id="form-cadastro" novalidate>
                <div class="campo">
                    <label for="cad-nome">Nome</label>
                    <input type="text" id="cad-nome" name="nome" maxlength="60" autocomplete="off" placeholder="Nome do personagem ou jogador">
                    <p data-erro="nome" class="erro-campo hidden"></p>
                </div>
                <div class="campo">
                    <label for="cad-email">E-mail</label>
                    <input type="email" id="cad-email" name="email" maxlength="254" autocomplete="off" placeholder="jogador@email.com">
                    <p data-erro="email" class="erro-campo hidden"></p>
                </div>
                <div class="campo">
                    <label for="cad-senha">Senha</label>
                    <input type="password" id="cad-senha" name="senha" autocomplete="new-password" placeholder="Mínimo de 6 caracteres">
                    <p data-erro="senha" class="erro-campo hidden"></p>
                </div>
                <div class="campo">
                    <label for="cad-senha2">Repetir senha</label>
                    <input type="password" id="cad-senha2" name="senha2" autocomplete="new-password" placeholder="••••••••">
                    <p data-erro="senha2" class="erro-campo hidden"></p>
                </div>
                <fieldset>
                    <legend>Permissão</legend>
                    <div class="papeis">
                        <label class="opcao-papel">
                            <input type="radio" name="papel" value="jogador" checked>
                            <span class="papel-jogador"><span>Jogador</span></span>
                        </label>
                        <label class="opcao-papel">
                            <input type="radio" name="papel" value="mestre">
                            <span class="papel-mestre"><span>Mestre</span></span>
                        </label>
                    </div>
                </fieldset>

                <div id="cad-resultado" class="resultado hidden" role="status"></div>

                <button type="submit" id="cad-enviar" class="btn">Cadastrar</button>
            </form>

            <p class="ajuda txt nota">A conta pode entrar no Hub logo após o cadastro.</p>
        </section>
    </main>

    <script>
        const modoAtual = localStorage.getItem('rpg_modo_sessao') || 'jogador';

        const form = document.getElementById('form-cadastro');
        const botao = document.getElementById('cad-enviar');
        const resultado = document.getElementById('cad-resultado');
        const campos = {
            nome: document.getElementById('cad-nome'),
            email: document.getElementById('cad-email'),
            senha: document.getElementById('cad-senha'),
            senha2: document.getElementById('cad-senha2')
        };
        let tentouEnviar = false;

        document.getElementById(modoAtual === 'mestre' ? 'painel-cadastro' : 'aviso-restrito').classList.remove('hidden');

        function lerDados() {
            return {
                nome: campos.nome.value.trim(),
                email: campos.email.value.trim(),
                senha: campos.senha.value,
                senha2: campos.senha2.value,
                papel: form.querySelector('input[name="papel"]:checked')?.value || 'jogador'
            };
        }

        // Retorna { campo: mensagem } só com os campos inválidos
        function validar(d) {
            const erros = {};
            if (!d.nome) erros.nome = 'Informe o nome.';

            if (!d.email) erros.email = 'Informe o e-mail.';
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) erros.email = 'E-mail inválido.';

            if (!d.senha) erros.senha = 'Informe a senha.';
            else if (d.senha.length < 6) erros.senha = 'A senha precisa ter pelo menos 6 caracteres.';

            if (!d.senha2) erros.senha2 = 'Repita a senha.';
            else if (d.senha2 !== d.senha) erros.senha2 = 'As senhas não conferem.';

            return erros;
        }

        function mostrarErros(erros) {
            Object.keys(campos).forEach((nome) => {
                const msg = form.querySelector(`[data-erro="${nome}"]`);
                const erro = erros[nome];
                campos[nome].classList.toggle('invalido', !!erro);
                campos[nome].setAttribute('aria-invalid', erro ? 'true' : 'false');
                msg.textContent = erro || '';
                msg.classList.toggle('hidden', !erro);
            });
        }

        function mostrarResultado(texto, sucesso) {
            resultado.textContent = texto;
            resultado.classList.toggle('ok', sucesso);
            resultado.classList.toggle('erro', !sucesso);
            resultado.classList.remove('hidden');
        }

        // Depois da primeira tentativa, os erros acompanham a digitação
        form.addEventListener('input', () => {
            if (tentouEnviar) mostrarErros(validar(lerDados()));
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            tentouEnviar = true;
            resultado.classList.add('hidden');

            const dados = lerDados();
            const erros = validar(dados);
            mostrarErros(erros);
            const primeiroInvalido = Object.keys(campos).find((nome) => erros[nome]);
            if (primeiroInvalido) {
                campos[primeiroInvalido].focus();
                return;
            }

            botao.disabled = true;
            try {
                await RPG.cadastrarUsuario({ nome: dados.nome, email: dados.email, senha: dados.senha, papel: dados.papel });
                form.reset();
                tentouEnviar = false;
                mostrarErros({});
                mostrarResultado(`${dados.nome} cadastrado como ${dados.papel === 'mestre' ? 'Mestre' : 'Jogador'}.`, true);
                campos.nome.focus();
            } catch (err) {
                console.error('Falha no cadastro:', err);
                const codigo = (err && (err.code || err.message)) || '';
                if (codigo === 'auth/email-already-in-use') {
                    mostrarErros({ email: 'Este e-mail já tem uma conta.' });
                    campos.email.focus();
                    return;
                }
                const mensagens = {
                    'auth/invalid-email': 'O serviço de login recusou este e-mail.',
                    'auth/weak-password': 'O serviço de login recusou esta senha: use uma mais forte.',
                    'auth/operation-not-allowed': 'O login por e-mail e senha está desativado no Firebase.',
                    'auth/network-request-failed': 'Sem ligação com o serviço de login. Tente novamente.',
                    'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente novamente.',
                    'auth-indisponivel': 'O serviço de login não respondeu. Tente novamente.',
                    'banco-indisponivel': 'O banco de dados não respondeu. A conta não foi criada.',
                    'PERMISSION_DENIED': 'O banco recusou o cadastro. A conta não foi criada.',
                    'sem-permissao': 'Só o Mestre pode cadastrar usuários.'
                };
                mostrarResultado(mensagens[codigo] || 'Não foi possível cadastrar. Tente novamente.', false);
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
