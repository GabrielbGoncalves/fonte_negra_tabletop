<!DOCTYPE html> 
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remédios da Escuridão - Loja GDC (Edição Azul Royal)</title>
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --p5-royal-blue: #4169e1;
      --p5-dark-blue: #002366;
      --p5-black: #121212;
      --p5-white: #ffffff;
      --p5-gray: #2a2a2a;
      --p5-yellow: #ffea00;
      --p5-red: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-transform: uppercase;
    }

    body {
      background-color: var(--p5-black);
      color: var(--p5-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      background-image: repeating-linear-gradient(
        -45deg,
        #000,
        #000 20px,
        #0a1128 20px,
        #0a1128 40px
      );
    }

    header {
      background: var(--p5-royal-blue);
      color: var(--p5-white);
      padding: 15px 30px;
      transform: rotate(-2deg);
      margin-bottom: 25px;
      box-shadow: 8px 8px 0px var(--p5-white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-hub {
      background: var(--p5-black);
      color: var(--p5-white);
      text-decoration: none;
      padding: 10px 18px;
      border: 2px solid var(--p5-white);
      transform: skew(-10deg);
      font-size: 1.1rem;
      transition: all 0.2s;
      display: inline-block;
    }

    .btn-hub:hover {
      background: var(--p5-white);
      color: var(--p5-black);
      transform: skew(-10deg) scale(1.05);
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0px var(--p5-black);
    }

    .wallet {
      background: var(--p5-black);
      color: var(--p5-yellow);
      padding: 8px 16px;
      transform: skew(-10deg);
      border: 2px solid var(--p5-white);
      font-size: 1.4rem;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      flex-grow: 1;
    }

    .dialogue-box {
      grid-column: 1 / -1;
      background: var(--p5-white);
      color: var(--p5-black);
      padding: 15px 20px;
      border-left: 10px solid var(--p5-royal-blue);
      transform: skew(-2deg);
      margin-bottom: 15px;
      box-shadow: 5px 5px 0px var(--p5-royal-blue);
      font-size: 1.1rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    .panel {
      background: rgba(18, 18, 18, 0.95);
      border: 3px solid var(--p5-royal-blue);
      padding: 20px;
      box-shadow: 6px 6px 0px var(--p5-white);
      margin-bottom: 20px;
    }

    .panel-mestre {
      grid-column: 1 / -1;
      border-color: var(--p5-yellow);
      background: rgba(10, 10, 20, 0.98);
    }

    .panel-title {
      background: var(--p5-white);
      color: var(--p5-black);
      display: inline-block;
      padding: 5px 15px;
      transform: rotate(-1deg);
      margin-bottom: 15px;
      font-size: 1.4rem;
    }

    .category-filters {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .btn-cat {
      background: var(--p5-gray);
      color: var(--p5-white);
      border: 2px solid var(--p5-white);
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      transform: skew(-5deg);
    }

    .btn-cat.active {
      background: var(--p5-royal-blue);
      color: var(--p5-white);
      border-color: var(--p5-yellow);
      box-shadow: 3px 3px 0px var(--p5-white);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--p5-royal-blue);
      color: var(--p5-white);
      border: none;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 1rem;
      transform: skew(-8deg);
      transition: all 0.1s ease;
      box-shadow: 3px 3px 0px var(--p5-white);
    }

    .btn:hover {
      background: var(--p5-white);
      color: var(--p5-black);
      transform: skew(-8deg) scale(1.05);
      box-shadow: 3px 3px 0px var(--p5-royal-blue);
    }

    .btn-danger {
      background: var(--p5-red);
    }

    .btn:disabled {
      background: var(--p5-gray);
      color: #777;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--p5-black);
      border: 2px solid var(--p5-white);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .item-card:hover {
      border-color: var(--p5-royal-blue);
    }

    .item-info {
      flex-grow: 1;
    }

    .item-name {
      font-size: 1.2rem;
      color: var(--p5-white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      background: var(--p5-royal-blue);
      color: var(--p5-white);
    }

    .item-desc {
      font-family: Arial, sans-serif;
      text-transform: none;
      font-size: 0.85rem;
      color: #ccc;
      margin-top: 4px;
    }

    .item-effect {
      font-family: Arial, sans-serif;
      text-transform: none;
      font-size: 0.85rem;
      color: var(--p5-yellow);
      margin-top: 2px;
      font-weight: bold;
    }

    .item-price {
      font-size: 1.3rem;
      color: var(--p5-yellow);
      margin: 0 15px;
      text-align: right;
    }

    .price-discount {
      text-decoration: line-through;
      color: #888;
      font-size: 0.9rem;
      display: block;
    }

    .inventory-list {
      list-style: none;
    }

    .inventory-item {
      padding: 10px;
      border-bottom: 1px dashed var(--p5-royal-blue);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inventory-item span {
      font-family: Arial, sans-serif;
      text-transform: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--p5-yellow);
    }

    .form-group input, .form-group select {
      background: var(--p5-black);
      border: 1px solid var(--p5-royal-blue);
      color: var(--p5-white);
      padding: 8px;
      font-family: Arial, sans-serif;
      text-transform: none;
    }

    .log-box {
      background: #000;
      border: 1px solid var(--p5-royal-blue);
      padding: 10px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      color: #00ff66;
      text-transform: none;
    }

    .log-entry {
      margin-bottom: 4px;
      border-bottom: 1px dotted #333;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="btn-hub">← Voltar ao Hub</a>
      <div>
        <h1>Remédios da Escuridão</h1>
        <span id="indicador-modo" class="inline-block mt-2 px-2 py-1 text-xs font-bold uppercase tracking-wider">Modo: a carregar...</span>
      </div>
    </div>
    <div class="wallet">PR: <span id="pr-display">10.0</span></div>
  </header>

  <div class="dialogue-box" id="dialogue">
    "Vai comprar alguma coisa ou só veio fazer sombra? Escolha logo."
  </div>

  <!-- PAINEL EXCLUSIVO DO MESTRE -->
  <div class="panel panel-mestre" id="painel-mestre" style="display: none;">
    <div class="panel-title" style="background: var(--p5-yellow); color: #000;">Painel de Controle do Mestre</div>
    
    <div class="form-grid">
      <div class="form-group">
        <label>Nome do Item:</label>
        <input type="text" id="novo-nome" placeholder="Ex: Katana Amaldiçoada">
      </div>
      <div class="form-group">
        <label>Categoria:</label>
        <select id="novo-tipo">
          <option value="Armas">Armas</option>
          <option value="Armadura">Armaduras</option>
          <option value="Acessório">Acessórios</option>
          <option value="Consumível">Itens / Consumíveis</option>
        </select>
      </div>
      <div class="form-group">
        <label>Preço Base (PR):</label>
        <input type="number" id="novo-preco" step="0.1" value="1.0">
      </div>
      <div class="form-group">
        <label>Estoque Inicial:</label>
        <input type="number" id="novo-estoque" value="3">
      </div>
      <div class="form-group" style="grid-column: span 2;">
        <label>Efeito:</label>
        <input type="text" id="novo-efeito" placeholder="Ex: FOR +2, Dano Crítico +10%">
      </div>
      <div class="form-group" style="grid-column: span 2;">
        <label>Descrição:</label>
        <input type="text" id="nova-desc" placeholder="Ex: Lâmina escura forjada nas sombras.">
      </div>
    </div>
    
    <div class="actions">
      <button class="btn" onclick="adicionarNovoItem()">+ Criar Novo Item</button>
    </div>

    <div style="margin-top: 15px;">
      <label style="font-size: 0.8rem; color: var(--p5-yellow);">Log de Alterações da Loja:</label>
      <div class="log-box" id="log-container">
        <div class="log-entry">[SISTEMA] Aguardando registos de alterações...</div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- PAINEL DA LOJA -->
    <div class="panel">
      <div class="panel-title">Est
