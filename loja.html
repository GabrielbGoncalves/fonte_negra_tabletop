<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Room - Loja do Grimório do Coração</title>
    <!-- Importação do Firebase (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --p5-black: #121212;
            --p5-dark-blue: #0b1329;
            --p5-royal-blue: #1c335e;
            --p5-red: #d90429;
            --p5-yellow: #ffb703;
            --p5-white: #f8f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--p5-black);
            color: var(--p5-white);
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--p5-dark-blue), var(--p5-royal-blue));
            padding: 20px;
            transform: skew(-3deg);
            border-bottom: 5px solid var(--p5-yellow);
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        header h1 {
            color: var(--p5-yellow);
            text-transform: uppercase;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 15px 20px;
            border-left: 6px solid var(--p5-yellow);
            margin-bottom: 25px;
            transform: skew(-1deg);
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-weight: bold;
            color: var(--p5-yellow);
        }

        input, select {
            background: #2a2a2a;
            color: var(--p5-white);
            border: 2px solid var(--p5-royal-blue);
            padding: 8px 12px;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--p5-yellow);
        }

        button {
            background: var(--p5-yellow);
            color: var(--p5-black);
            font-weight: bold;
            border: none;
            padding: 10px 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            transform: skew(-5deg);
        }

        button:hover {
            background: #ffa200;
            transform: skew(-5deg) scale(1.05);
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #181818;
            border: 2px solid var(--p5-royal-blue);
            padding: 20px;
            position: relative;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 10px; height: 10px;
            background: var(--p5-yellow);
        }

        h2 {
            color: var(--p5-yellow);
            border-bottom: 2px dashed var(--p5-royal-blue);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1.4rem;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: var(--p5-dark-blue);
            border: 2px solid var(--p5-royal-blue);
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .item-card:hover {
            border-color: var(--p5-yellow);
            box-shadow: 0 5px 15px rgba(28, 51, 94, 0.4);
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--p5-yellow);
            margin-bottom: 5px;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        .item-price {
            font-weight: bold;
            color: #4ea8de;
        }

        .item-stock {
            font-size: 0.8rem;
            color: #888;
        }

        .log-box {
            background: #0f0f0f;
            border: 1px solid #333;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #4ade80;
        }

        .master-only {
            display: none;
        }

        .form-control {
            margin-bottom: 12px;
        }

        .form-control label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .form-control input, .form-control textarea {
            width: 100%;
        }

        textarea {
            resize: vertical;
            height: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Velvet Room // Loja GDC</h1>
    </header>

    <div class="controls-bar">
        <div class="control-group">
            <label for="modoSelect">Modo:</label>
            <select id="modoSelect" onchange="mudarModo()">
                <option value="jogador">Jogador</option>
                <option value="mestre">Mestre (Admin)</option>
            </select>
            <label for="saldoPR">Seu PR:</label>
            <input type="number" id="saldoPR" value="10.00" step="0.25" style="width: 90px;" />
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="arcanaImperatriz" /> Arcana III (Imperatriz Ativa)
            </label>
        </div>
    </div>

    <div class="main-container">
        <!-- Lado Esquerdo: Catálogo da Loja -->
        <div class="panel">
            <h2>Catálogo de Itens</h2>
            <div id="catalogGrid" class="catalog-grid">
                <!-- Itens carregados via Firebase -->
            </div>
        </div>

        <!-- Lado Direito: Painel de Controle / Logs -->
        <div class="panel">
            <div id="painelMestre" class="master-only" style="margin-bottom: 25px;">
                <h2>Painel do Mestre</h2>
                <div class="form-control">
                    <label>Nome do Item</label>
                    <input type="text" id="newItemName" placeholder="Ex: Soma de Vida Média" />
                </div>
                <div class="form-control">
                    <label>Descrição</label>
                    <textarea id="newItemDesc" placeholder="Efeito do item..."></textarea>
                </div>
                <div class="form-control">
                    <label>Preço (PR)</label>
                    <input type="number" id="newItemPrice" step="0.25" value="1.00" />
                </div>
                <div class="form-control">
                    <label>Estoque</label>
                    <input type="number" id="newItemStock" value="5" />
                </div>
                <button onclick="adicionarItemLoja()">Adicionar ao Catálogo</button>
            </div>

            <h2>Registro de Transações</h2>
            <div id="logBox" class="log-box">
                [Sistema Inicializado...]
            </div>
        </div>
    </div>

    <script>
        // Configuração do Firebase (Substitua com suas credenciais reais)
        const firebaseConfig = {
            apiKey: "AIzaSyAygeIUCDk9yZLczUYGKls0NSzD46wgpGI",
      authDomain: "fonte-d9637.firebaseapp.com",
      databaseURL: "https://fonte-d9637-default-rtdb.firebaseio.com",
      projectId: "fonte-d9637",
      storageBucket: "fonte-d9637.firebasestorage.app",
      messagingSenderId: "925243258445",
      appId: "1:925243258445:web:d7cf4c3d6b66d50337ce04",
      measurementId: "G-8762GDVEXY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Referências no Firebase
        const storeRef = db.ref('loja/storeCatalog');
        const logsRef = db.ref('loja/logs');

        // Alternância de Modo (Jogador / Mestre)
        function mudarModo() {
            const modo = document.getElementById('modoSelect').value;
            localStorage.setItem('gdc_store_mode', modo);
            atualizarInterfaceModo();
        }

        function atualizarInterfaceModo() {
            const modo = localStorage.getItem('gdc_store_mode') || 'jogador';
            document.getElementById('modoSelect').value = modo;
            const elements = document.querySelectorAll('.master-only');
            elements.forEach(el => {
                el.style.display = (modo === 'mestre') ? 'block' : 'none';
            });
        }

        // Listener em Tempo Real do Catálogo
        storeRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';

            if (!data) {
                grid.innerHTML = '<p style="color: #777;">Nenhum item à venda no momento.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div>
                        <div class="item-title">${item.nome}</div>
                        <div class="item-desc">${item.descricao}</div>
                    </div>
                    <div class="item-footer">
                        <div>
                            <div class="item-price">${item.preco.toFixed(2)} PR</div>
                            <div class="item-stock">Estoque: ${item.estoque}</div>
                        </div>
                        <button onclick="comprarItem('${key}')">Comprar</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        // Listener de Logs
        logsRef.limitToLast(15).on('child_added', (snapshot) => {
            const log = snapshot.val();
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<div>[${log.hora}] ${log.mensagem}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        });

        // Adicionar Item (Apenas Mestre)
        function adicionarItemLoja() {
            const nome = document.getElementById('newItemName').value;
            const descricao = document.getElementById('newItemDesc').value;
            const preco = parseFloat(document.getElementById('newItemPrice').value);
            const estoque = parseInt(document.getElementById('newItemStock').value);

            if (!nome || isNaN(preco) || isNaN(estoque)) {
                alert('Preencha os campos corretamente.');
                return;
            }

            storeRef.push({ nome, descricao, preco, estoque });
            document.getElementById('newItemName').value = '';
            document.getElementById('newItemDesc').value = '';
        }

        // Compra Segura utilizando Transações do Firebase (Previne Race Condition)
        function comprarItem(itemId) {
            let saldoAtual = parseFloat(document.getElementById('saldoPR').value);
            const imperatrizAtiva = document.getElementById('arcanaImperatriz').checked;

            const itemRef = storeRef.child(itemId);

            itemRef.transaction(item => {
                if (item) {
                    // Cálculo do preço aplicando o bônus da Arcana Imperatriz (desconto fixo de 2.0 PR, mínimo de 0.25 PR)
                    let precoFinal = item.preco;
                    if (imperatrizAtiva) {
                        precoFinal = Math.max(0.25, item.preco - 2.0);
                    }

                    if (item.estoque <= 0) {
                        alert("Item esgotado!");
                        return; // Cancela transação
                    }
                    if (saldoAtual < precoFinal) {
                        alert("Pontos de Recurso (PR) insuficientes!");
                        return; // Cancela transação
                    }

                    // Deduz saldo localmente para simulação imediata
                    saldoAtual -= precoFinal;
                    document.getElementById('saldoPR').value = saldoAtual.toFixed(2);

                    // Efetua baixa no estoque no banco de dados
                    item.estoque -= 1;
                    
                    // Registra log da transação
                    logsRef.push({
                        hora: new Date().toLocaleTimeString(),
                        mensagem: `Item adquirido: ${item.nome} por ${precoFinal.toFixed(2)} PR.`
                    });
                }
                return item;
            }, (error, committed) => {
                if (error) {
                    console.error('Erro na transação de compra:', error);
                } else if (committed) {
                    console.log('Compra realizada com sucesso!');
                }
            });
        }

        // Inicialização do Estado
        window.onload = () => {
            atualizarInterfaceModo();
        };
    </script>
</body>
</html>
