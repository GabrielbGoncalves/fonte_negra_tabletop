<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app http://127.0.0.1:9000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000; frame-src https://*.firebaseapp.com https://*.firebaseio.com http://127.0.0.1:9000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Fonte Negra">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimório do Coração | Fonte Negra</title>
    
    <!-- Google Fonts for RPG Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" integrity="sha384-4gq9w/AGf72FXdNQ3Kn3EqWP7633NbCMjpYHt8YCZyXf23o2opcuAr4cif41tLrC" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" integrity="sha384-5PDE6CZvnNIJI5xu68GIFoOO3U73lAnRLBwPBmmKjWnYnYwKEHWr/ghtGooEOXGb" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" integrity="sha384-xtdq4MQqPj1dB5DQsuw9O7dh4kHhMP/Wp5u8O1jiaWiou13ZfJIgiccjtVK2pBhL" crossorigin="anonymous"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sessao.js" data-exigir-login></script>
    <script src="js/topo.js" defer></script>
    <link rel="stylesheet" href="assets/css/layout.css">
    
    <style>
        /* Layout, topo e controles vêm de assets/css/layout.css; aqui só o conteúdo do grimório */
        .frase { font-family: 'Cormorant Garamond', serif; text-transform: none; }

        .dungeon-card {
            background-color: var(--painel);
            border: 2px solid var(--azul-escuro);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .dungeon-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, var(--theme-color) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 1;
        }

        .dungeon-card.completed {
            border-color: var(--theme-color);
            box-shadow: 0 0 20px -5px var(--theme-color), inset 0 0 15px -10px var(--theme-color);
        }

        .dungeon-card.completed::before {
            opacity: 0.15;
        }

        .virtue {
            transition: all 0.5s ease;
            opacity: 0.6;
            filter: grayscale(100%);
        }
        
        .dungeon-card.completed .virtue {
            opacity: 1;
            filter: grayscale(0%);
            text-shadow: 0 0 10px var(--theme-color);
            font-weight: 700;
        }

        .flaw {
            transition: all 0.5s ease;
            position: relative;
            display: inline-block;
        }

        .dungeon-card.completed .flaw {
            opacity: 0.4;
            text-decoration: line-through;
            text-decoration-color: #ef4444;
            text-decoration-thickness: 2px;
        }

        .seal-toggle {
            appearance: none;
            width: 40px;
            height: 40px;
            border: 2px solid var(--azul-claro);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.4s ease;
            outline: none;
            z-index: 10;
        }

        .seal-toggle:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .seal-toggle::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 1.2rem;
            color: var(--theme-color);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .seal-toggle:checked {
            border-color: var(--theme-color);
            box-shadow: 0 0 10px var(--theme-color);
        }

        .seal-toggle:checked::after {
            transform: translate(-50%, -50%) scale(1);
        }

        .progress-glow {
            box-shadow: 0 0 15px var(--current-color, #a855f7);
            transition: width 0.8s ease, box-shadow 0.8s ease, background-color 0.8s ease;
        }
    </style>
</head>
<body>

    <header class="topo">
        <a class="voltar" href="index.html">‹ Hub</a>
        <div class="titulo">
            <h1>Grimório do Coração</h1>
            <p class="tagline">Progresso das dungeons da campanha</p>
        </div>
        <div class="espaco"></div>
        <div class="usuario" data-usuario hidden></div>
    </header>

    <main class="conteudo">
        <!-- Progresso da campanha -->
        <section class="bloco">
            <p class="frase text-xl md:text-2xl text-slate-300 italic mt-0 mb-4 text-center">
                "A jornada da alma através das provações. Desperte as virtudes, quebre as correntes."[cite: 5]
            </p>
            <div class="flex justify-between items-end mb-2">
                <h2 class="!mb-0">Progresso da Campanha[cite: 5]</h2>
                <span id="progress-text" class="text-2xl font-bold text-white">0%</span>
            </div>
            <div class="h-4 w-full bg-slate-950 overflow-hidden border-2 border-blue-900 relative">
                <div id="progress-bar" class="h-full bg-gray-600 progress-glow w-0 relative" style="--current-color: #4b5563;">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
        </section>

        <div id="dungeon-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>
    </main>

    <script>
        // Firebase e sessão vêm de js/sessao.js (o acesso ao banco aguarda o login)
        const db = RPG.db;

        // Gestão de Modo (Mestre vs Jogador)
        const modoAtual = localStorage.getItem('rpg_modo_sessao') || 'jogador';

        const dungeons = [
            {
                id: 'justica',
                title: 'Justiça vs Tirania[cite: 5]',
                virtue: 'Justiça[cite: 5]',
                flaw: 'Tirania[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve quebrar a[cite: 5]',
                suffix: '.',
                colorHex: '#eab308',
                colorClass: 'text-yellow-400'
            },
            {
                id: 'gentileza',
                title: 'Gentileza vs Crueldade[cite: 5]',
                virtue: 'Gentileza[cite: 5]',
                flaw: 'Crueldade[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve estancar a[cite: 5]',
                suffix: '.',
                colorHex: '#22c55e',
                colorClass: 'text-green-500'
            },
            {
                id: 'bravura',
                title: 'Bravura vs Covardia[cite: 5]',
                virtue: 'Bravura[cite: 5]',
                flaw: 'Covardia[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve devorar a[cite: 5]',
                suffix: '.',
                colorHex: '#f97316',
                colorClass: 'text-orange-500'
            },
            {
                id: 'integridade',
                title: 'Integridade vs Falsidade[cite: 5]',
                virtue: 'Integridade[cite: 5]',
                flaw: 'Falsidade[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve despedaçar a[cite: 5]',
                suffix: '.',
                colorHex: '#3b82f6',
                colorClass: 'text-blue-500'
            },
            {
                id: 'paciencia',
                title: 'Paciência vs Ira[cite: 5]',
                virtue: 'Paciência[cite: 5]',
                flaw: 'Ira[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve esfriar a[cite: 5]',
                suffix: '.',
                colorHex: '#06b6d4',
                colorClass: 'text-cyan-400'
            },
            {
                id: 'perseveranca',
                title: 'Perseverança vs Omissão[cite: 5]',
                virtue: 'Perseverança[cite: 5]',
                flaw: 'Omissão[cite: 5]',
                prefix: 'A[cite: 5]',
                middle: ' deve reerguer a[cite: 5]',
                suffix: '.',
                colorHex: '#a855f7',
                colorClass: 'text-purple-500'
            },
            {
                id: 'determinacao',
                title: 'Determinação vs Desespero[cite: 5]',
                virtue: 'Determinação[cite: 5]',
                flaw: 'Desespero[cite: 5]',
                prefix: 'E a Determinação... A[cite: 5]',
                middle: ' deve superar o[cite: 5]',
                suffix: '.',
                colorHex: '#ef4444',
                colorClass: 'text-red-500',
                isWide: true
            }
        ];

        const container = document.getElementById('dungeon-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        let savedState = {};

        function saveStateToFirebase() {
            if (modoAtual !== 'mestre') return;
            db.ref('grimorio_state').set(savedState);
        }

        function createCards() {
            container.innerHTML = '';
            dungeons.forEach((d) => {
                const isChecked = savedState[d.id] === true;
                
                const card = document.createElement('div');
                card.className = `dungeon-card p-6 flex flex-col justify-between ${isChecked ? 'completed' : ''}`;
                if (d.isWide) {
                    card.classList.add('md:col-span-2', 'lg:col-span-3', 'lg:w-2/3', 'lg:mx-auto');
                }
                
                card.style.setProperty('--theme-color', d.colorHex);

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <h2 class="text-xl font-bold text-slate-100 uppercase tracking-wider">${d.title}</h2>
                        <input type="checkbox" id="toggle-${d.id}" class="seal-toggle shrink-0 ml-4" ${isChecked ? 'checked' : ''} ${modoAtual === 'jogador' ? 'disabled' : ''}>
                    </div>
                    
                    <div class="mt-auto">
                        <p class="frase text-2xl leading-relaxed italic">
                            ${d.prefix}
                            <span class="virtue ${d.colorClass}">${d.virtue}</span>
                            ${d.middle}
                            <span class="flaw">${d.flaw}</span>
                            ${d.suffix}
                        </p>
                    </div>
                `;

                container.appendChild(card);

                const toggle = card.querySelector(`#toggle-${d.id}`);
                if (modoAtual === 'mestre') {
                    toggle.addEventListener('change', (e) => {
                        savedState[d.id] = e.target.checked;
                        if (e.target.checked) {
                            card.classList.add('completed');
                        } else {
                            card.classList.remove('completed');
                        }
                        saveStateToFirebase();
                        updateProgress();
                    });
                }
            });
        }

        function updateProgress() {
            const total = dungeons.length;
            const completedCount = Object.values(savedState).filter(val => val === true).length;
            const percentage = Math.round((completedCount / total) * 100);
            
            progressText.innerText = `${percentage}%`;
            progressBar.style.width = `${percentage}%`;

            if (percentage === 0) {
                progressBar.style.backgroundColor = '#4b5563';
                progressBar.style.setProperty('--current-color', 'transparent');
            } else if (percentage === 100) {
                progressBar.style.backgroundColor = '#ef4444';
                progressBar.style.setProperty('--current-color', '#ef4444');
                progressText.style.color = '#ef4444';
                progressText.style.textShadow = '0 0 10px #ef4444';
            } else {
                progressBar.style.backgroundColor = '#a855f7'; 
                progressBar.style.setProperty('--current-color', '#a855f7');
                progressText.style.color = '#fff';
                progressText.style.textShadow = 'none';
            }
        }

        // Sincronização em tempo real com Firebase
        db.ref('grimorio_state').on('value', (snapshot) => {
            const data = snapshot.val();
            // Sem nada salvo (o banco não guarda objeto vazio), os cards aparecem todos abertos
            savedState = (data && typeof data === 'object') ? data : {};
            createCards();
            updateProgress();
        });

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('grimorio_state').once('value', (snapshot) => {
                if (!snapshot.exists() && modoAtual === 'mestre') {
                    saveStateToFirebase();
                }
            });
        });
    </script>
</body>
</html>
