<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com https://*.firebaseio.com https://*.firebasedatabase.app http://127.0.0.1:9000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000; frame-src https://*.firebaseapp.com https://*.firebaseio.com http://127.0.0.1:9000; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">

    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Grid | Fonte Negra</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" integrity="sha384-4gq9w/AGf72FXdNQ3Kn3EqWP7633NbCMjpYHt8YCZyXf23o2opcuAr4cif41tLrC" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js" integrity="sha384-5PDE6CZvnNIJI5xu68GIFoOO3U73lAnRLBwPBmmKjWnYnYwKEHWr/ghtGooEOXGb" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" integrity="sha384-xtdq4MQqPj1dB5DQsuw9O7dh4kHhMP/Wp5u8O1jiaWiou13ZfJIgiccjtVK2pBhL" crossorigin="anonymous"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sessao.js" data-exigir-login></script>
    <script src="js/topo.js" defer></script>

    <link rel="stylesheet" href="assets/css/layout.css">
    <style>
        /* Layout, topo e controles vêm de assets/css/layout.css */
        main.conteudo { max-width: 760px; }

        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        /* Cada ferramenta mantém a cor do tipo de célula na borda esquerda */
        .controls .btn { border-left-width: 8px; }
        .controls .btn.active { background: var(--azul); border-color: var(--azul-claro); }
        .btn-chao { border-left-color: #e0e0e0 !important; }
        .btn-parede { border-left-color: #444 !important; }
        .btn-porta { border-left-color: #8B4513 !important; }
        .btn-armadilha { border-left-color: #d9534f !important; }
        .btn-tesouro { border-left-color: #f0ad4e !important; }

        .acoes-mapa { margin-top: 12px; }
        .grid-rolagem { overflow-x: auto; }
        .grid {
            display: grid;
            grid-template-columns: repeat(15, 40px);
            grid-template-rows: repeat(15, 40px);
            gap: 2px;
            width: max-content;
            margin: 0 auto;
            background-color: var(--azul-escuro);
            padding: 5px;
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            user-select: none;
        }

        .cell.parede { background-color: #444; }
        .cell.porta { background-color: #8B4513; }
        .cell.armadilha { background-color: #d9534f; }
        .cell.tesouro { background-color: #f0ad4e; }
        .cell.inicio { background-color: #5cb85c; }
        .cell.fim { background-color: #0275d8; }

        .xml-container { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
        .xml-container textarea {
            height: 180px;
            color: #75beff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header class="topo">
    <a class="voltar" href="index.html">‹ Hub</a>
    <div class="titulo">
        <h1>Editor de Grid</h1>
        <p class="tagline">Monte o mapa tático e exporte em XML</p>
    </div>
    <div class="espaco"></div>
    <div class="usuario" data-usuario hidden></div>
</header>

<main class="conteudo">
    <!-- Painel de Ferramentas -->
    <section class="bloco" id="painel-controles">
        <h2>Ferramentas</h2>
        <div class="controls">
            <button type="button" class="btn sec btn-chao active" onclick="setFerramenta('chao', this)">Chão (Borracha)</button>
            <button type="button" class="btn sec btn-parede" onclick="setFerramenta('parede', this)">Parede (⬛)</button>
            <button type="button" class="btn sec btn-porta" onclick="setFerramenta('porta', this)">Porta (🚪)</button>
            <button type="button" class="btn sec btn-armadilha" onclick="setFerramenta('armadilha', this)">Armadilha (💀)</button>
            <button type="button" class="btn sec btn-tesouro" onclick="setFerramenta('tesouro', this)">Tesouro (💎)</button>
        </div>
        <div class="controls acoes-mapa">
            <button type="button" class="btn sec btn-aleatorio" onclick="gerarMapaAleatorio()">🎲 Gerar Labirinto Aleatório</button>
            <button type="button" class="btn perigo btn-limpar" onclick="limparMapa()">Limpar Tudo</button>
            <button type="button" class="btn btn-xml" onclick="exportarXML()">📄 Exportar XML</button>
        </div>
    </section>

    <!-- Grid do Mapa -->
    <section class="bloco grid-rolagem">
        <div class="grid" id="grid"></div>
    </section>

    <!-- Caixa para exibir e copiar o XML gerado -->
    <section class="bloco xml-container" id="painel-xml">
        <h2 id="titulo-xml">XML Gerado</h2>
        <textarea id="xmlArea" aria-labelledby="titulo-xml" readonly placeholder="Clique em 'Exportar XML' para gerar a estrutura..."></textarea>
        <button type="button" class="btn btn-xml" onclick="copiarXML()">📋 Copiar XML</button>
    </section>
</main>

    <script>
        // Firebase e sessão vêm de js/sessao.js (o acesso ao banco aguarda o login)
        const db = RPG.db;

        // Gestão de Modo (Mestre vs Jogador)
        const modoAtual = localStorage.getItem('rpg_modo_sessao') || 'jogador';

        if (modoAtual !== 'mestre') {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('painel-controles').style.display = 'none';
                document.getElementById('painel-xml').style.display = 'none';
            });
        }

        const TAMANHO_GRID = 15; 
        let ferramentaAtual = 'chao'; 
        
        const icones = {
            chao: '',
            parede: '⬛',
            porta: '🚪',
            armadilha: '💀',
            tesouro: '💎',
            inicio: '🟢',
            fim: '🏁'
        };

        const CODIGOS_XML = {
            chao: '0',
            parede: '1',
            armadilha: '2',
            tesouro: '3',
            porta: 'P',
            inicio: 'I',
            fim: 'F'
        };

        function criarGrid() {
            const gridContainer = document.getElementById('grid');
            gridContainer.innerHTML = '';
            
            gridContainer.style.gridTemplateColumns = `repeat(${TAMANHO_GRID}, 40px)`;
            gridContainer.style.gridTemplateRows = `repeat(${TAMANHO_GRID}, 40px)`;
            
            for (let i = 0; i < TAMANHO_GRID * TAMANHO_GRID; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (modoAtual === 'mestre') {
                    cell.addEventListener('mousedown', () => {
                        aplicarElemento(cell);
                        exportarXML();
                    });
                    cell.addEventListener('mouseenter', (e) => {
                        if (e.buttons === 1) {
                            aplicarElemento(cell);
                            exportarXML();
                        }
                    });
                } else {
                    cell.style.cursor = 'default';
                }

                gridContainer.appendChild(cell);
            }
        }

        function setFerramenta(ferramenta, botao) {
            if (modoAtual !== 'mestre') return;
            ferramentaAtual = ferramenta;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            botao.classList.add('active');
        }

        function aplicarElemento(celula, ferramenta = ferramentaAtual) {
            celula.className = 'cell';
            if (ferramenta !== 'chao') {
                celula.classList.add(ferramenta);
            }
            celula.innerText = icones[ferramenta] || ''; 
        }

        function limparMapa() {
            if (modoAtual !== 'mestre') return;
            document.querySelectorAll('.cell').forEach(celula => {
                celula.className = 'cell';
                celula.innerText = '';
            });
            document.getElementById('xmlArea').value = '';
            exportarXML();
        }

        function gerarHashDaSemente(texto) {
            let hash = 0;
            for (let i = 0; i < texto.length; i++) {
                hash = Math.imul(31, hash) + texto.charCodeAt(i) | 0;
            }
            return hash;
        }

        let randomComSeed; 
        function iniciarSeed(semente) {
            let a = typeof semente === 'string' ? gerarHashDaSemente(semente) : semente;
            randomComSeed = function() {
                var t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function gerarLabirinto(largura, altura, semente) {
            iniciarSeed(semente);
            let matriz = Array.from({ length: altura }, () => Array(largura).fill('parede'));
            
            let caminhos = [[1, 1]];
            matriz[1][1] = 'chao';

            const direcoes = [[0, -2], [2, 0], [0, 2], [-2, 0]];

            while (caminhos.length > 0) {
                let atual = caminhos[caminhos.length - 1];
                let x = atual[0], y = atual[1];

                let vizinhosValidos = direcoes
                    .map(dir => [x + dir[0], y + dir[1], dir[0], dir[1]])
                    .filter(viz =>
                        viz[1] > 0 && viz[1] < altura - 1 &&
                        viz[0] > 0 && viz[0] < largura - 1 &&
                        matriz[viz[1]][viz[0]] === 'parede'
                    )
                    .sort(() => randomComSeed() - 0.5);

                if (vizinhosValidos.length > 0) {
                    let [vizX, vizY, dirX, dirY] = vizinhosValidos[0];
                    matriz[y + (dirY / 2)][x + (dirX / 2)] = 'chao';
                    matriz[vizY][vizX] = 'chao';
                    caminhos.push([vizX, vizY]);
                } else {
                    caminhos.pop();
                }
            }

            matriz[1][1] = 'inicio';
            matriz[altura - 2][largura - 2] = 'fim';

            return matriz;
        }

        function gerarMapaAleatorio(sementeInput) {
            if (modoAtual !== 'mestre') return;
            const celulas = document.querySelectorAll('.cell');
            
            const sementeAtiva = sementeInput || Math.random().toString(36).substring(2, 10);
            const mapaLogico = gerarLabirinto(TAMANHO_GRID, TAMANHO_GRID, sementeAtiva);

            let indiceDaCelula = 0;

            for (let y = 0; y < TAMANHO_GRID; y++) {
                for (let x = 0; x < TAMANHO_GRID; x++) {
                    if (!celulas[indiceDaCelula]) break;

                    let elementoAtual = mapaLogico[y][x];

                    if (elementoAtual === 'chao') {
                        const chance = randomComSeed();
                        if (chance < 0.05) elementoAtual = 'armadilha';
                        else if (chance < 0.08) elementoAtual = 'tesouro';
                        else if (chance < 0.10) elementoAtual = 'porta';
                    }

                    aplicarElemento(celulas[indiceDaCelula], elementoAtual);
                    indiceDaCelula++;
                }
            }
            exportarXML();
        }

        function exportarXML() {
            const celulas = document.querySelectorAll('.cell');
            let linhasXML = [];
            let indice = 0;

            for (let y = 0; y < TAMANHO_GRID; y++) {
                let valoresLinha = [];

                for (let x = 0; x < TAMANHO_GRID; x++) {
                    const celula = celulas[indice];
                    
                    let tipoEncontrado = 'chao';
                    for (let tipo in CODIGOS_XML) {
                        if (celula.classList.contains(tipo)) {
                            tipoEncontrado = tipo;
                            break;
                        }
                    }

                    valoresLinha.push(CODIGOS_XML[tipoEncontrado]);
                    indice++;
                }

                linhasXML.push(` <linha y="${y}">${valoresLinha.join(',')}</linha>`);
            }

            const xmlCompleto = `<mapa largura="${TAMANHO_GRID}" altura="${TAMANHO_GRID}">
  <matriz>
${linhasXML.join('\n')}
  </matriz>
</mapa>`;

            if (modoAtual === 'mestre') {
                document.getElementById('xmlArea').value = xmlCompleto;
                db.ref('teste_grid').set({ xml: xmlCompleto });
            }
        }

        function carregarMapaXML(xmlString) {
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "text/xml");
                const mapaNode = xmlDoc.querySelector("mapa");
                if (!mapaNode) return;

                const linhas = xmlDoc.querySelectorAll("matriz linha");
                const celulas = document.querySelectorAll('.cell');
                let indice = 0;

                linhas.forEach((linhaNode) => {
                    const codigos = linhaNode.textContent.trim().split(",");
                    codigos.forEach((codigo) => {
                        codigo = codigo.trim();
                        let tipo = 'chao';
                        for (let t in CODIGOS_XML) {
                            if (CODIGOS_XML[t] === codigo) {
                                tipo = t;
                                break;
                            }
                        }
                        if (celulas[indice]) {
                            aplicarElemento(celulas[indice], tipo);
                        }
                        indice++;
                    });
                });
            } catch(e) {}
        }

        function copiarXML() {
            const xmlArea = document.getElementById('xmlArea');
            if (!xmlArea.value) {
                alert("Gere o XML primeiro clicando no botão 'Exportar XML'!");
                return;
            }
            xmlArea.select();
            navigator.clipboard.writeText(xmlArea.value);
            alert("XML copiado para a área de transferência!");
        }

        // Sincronização em tempo real com Firebase
        db.ref('teste_grid/xml').on('value', (snapshot) => {
            const xmlData = snapshot.val();
            if (xmlData) {
                carregarMapaXML(xmlData);
            } else if (modoAtual === 'mestre') {
                gerarMapaAleatorio();
            }
        });

        criarGrid();
        window.onload = function() {
            db.ref('teste_grid/xml').once('value', (snapshot) => {
                if (!snapshot.exists() && modoAtual === 'mestre') {
                    gerarMapaAleatorio();
                }
            });
        };
    </script>
</body>
</html>
